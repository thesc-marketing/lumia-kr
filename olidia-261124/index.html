<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">

<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard/dist/web/static/pretendard.css">
<style>
:root{--ink:#191f28;--sub:#6b7684;--line:#e5e8eb;--acc:#3182f6;--ai:#7c3aed}
*{box-sizing:border-box}body{margin:0;font-family:Pretendard,system-ui,sans-serif;color:var(--ink);background:#fff;line-height:1.6}
header{padding:48px 24px 24px;max-width:1080px;margin:auto}header h1{font-size:28px;margin:0 0 6px}header p{color:var(--sub);margin:0}
nav{position:sticky;top:0;background:#fffe;backdrop-filter:blur(8px);border-bottom:1px solid var(--line);z-index:5}
nav div{max-width:1080px;margin:auto;padding:0 24px;display:flex;gap:20px;overflow-x:auto}
nav a{white-space:nowrap;padding:14px 0;color:var(--sub);text-decoration:none;font-weight:600;font-size:15px}nav a:hover{color:var(--acc)}
main{max-width:1080px;margin:auto;padding:0 24px 80px}section{padding:48px 0;border-bottom:1px solid var(--line)}
.eyebrow{color:var(--acc);font-weight:700;font-size:14px;margin:0}h2{font-size:24px;margin:4px 0 20px}
h3{font-size:17px;margin:36px 0 12px}.note{color:var(--sub);font-size:14px;margin:-4px 0 12px}
.kv{display:grid;grid-template-columns:88px 1fr;margin:0;border-top:1px solid var(--line)}
.kv dt,.kv dd{margin:0;padding:10px 0;border-bottom:1px solid var(--line)}.kv dt{color:var(--sub);font-size:14px}.kv dd{font-weight:600}
table{width:100%;border-collapse:collapse;font-size:15px}th{text-align:left;color:var(--sub);font-weight:600;font-size:13px;padding:8px 10px;border-bottom:1px solid var(--ink)}
td{padding:9px 10px;border-bottom:1px solid var(--line)}td:not(:first-child),th:not(:first-child){text-align:right}
tr.top td{font-weight:700}.medal{display:inline-grid;place-items:center;width:20px;height:20px;border-radius:50%;background:var(--acc);color:#fff;font-size:12px;margin-right:8px}
.grid{display:grid;gap:16px}.grid.v{grid-template-columns:repeat(auto-fill,minmax(200px,1fr))}.grid.p{grid-template-columns:repeat(auto-fill,minmax(220px,1fr))}
figure{margin:0}.media{position:relative;border:1px solid var(--line);border-radius:10px;overflow:hidden;background:#f2f4f6}
.grid.v .media{aspect-ratio:9/16}.grid.p .media{aspect-ratio:4/5}
.media video,.media img{width:100%;height:100%;object-fit:cover;display:block}
.tag{position:absolute;top:8px;left:8px;z-index:2;background:var(--ai);color:#fff;font-size:12px;font-weight:700;padding:3px 9px;border-radius:99px}
figcaption{padding:8px 2px 0;display:flex;flex-direction:column}figcaption b{font-size:15px}figcaption span{color:var(--sub);font-size:13px}
.links{display:flex;gap:10px;flex-wrap:wrap}.links a{display:inline-block;padding:12px 18px;border-radius:10px;background:var(--acc);color:#fff;text-decoration:none;font-weight:700}
</style></head><body>
